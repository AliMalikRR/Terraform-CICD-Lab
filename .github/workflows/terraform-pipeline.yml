
name: Terraform CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Prevent multiple workflow runs accessing Terraform state simultaneously
concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:

  # -----------------------------
  # JOB 1: TERRAFORM PLAN
  # -----------------------------

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Azure using service principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Check Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Initialise Terraform and Azure remote backend
      - name: Terraform Init
        run: terraform init -input=false

      # Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Generate Terraform execution plan
      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      # Save plan for the apply job
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 1

  # -----------------------------
  # JOB 2: TERRAFORM APPLY
  # -----------------------------

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan

    # Manual approval gate
    environment: terraform-approval

    steps:
      # Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Initialise Terraform backend
      - name: Terraform Init
        run: terraform init -input=false

      # Download the exact plan generated in Job 1
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      # Apply the approved plan
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
